name: Scientific and standalone QA
on: [push, pull_request, workflow_dispatch]
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python scripts/acquire_v5.py --offline
      - run: python scripts/normalize_snapshots.py
      - run: python scripts/run_qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scientific-qa
          path: qa/v5/
